<div class="form-group">
     <label>{{ $field->label }}
         @if($field->required)
         <span class="required">*</span>
         @endif
     </label>
     <div class='form-group-controls'>
         @if($field->helper_text)
         <div class="help-text">
             {{ $field->helper_text }}
         </div>
         @endif
         <div>
         	 @let($error_class = $field->errors ? "input_error" : "")
         	 <input class="{{ $error_class }}" type='url' placeholder='{{ $field->placeholder }}' name='{{ $field->name }}' id='{{ $field->id }}' value='{{ $field->value }}'/>
             @if($field->errors)
             <div class="field-error">
                 {{ implode(',', $field->errors) }}
             </div>
             @endif
         </div>
     </div>
 </div>
