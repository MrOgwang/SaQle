<div class="form-group">
     <label>{{ $field->label }}
         @if($field->required)
         <span class="required">*</span>
         @endif
     </label>
     <div class='form-group-controls'>
         @if($field->helper_text)
         <div class="help-text">
             {{ $field->helper_text }}
         </div>
         @endif
         <div>
             <div class="choice-group">
				 @foreach($field->choices as $key => $value)
				 <div class="choice radio">
                     @let($checked = $field->value === $key ? "checked='checked'" : "")
                     <input {{ $checked }} class='{{ $field->class }}' type='radio' name='{{ $field->name }}' id='{{ $field->id }}_{{ $key }}' value='{{ $key }}'/>
					 <label for="{{ $field->id }}_{{ $key }}">{{ $value }}</label>
				 </div>
			     @endforeach
			 </div>
             @if($field->errors)
             <div class="field-error">
                 {{ implode(',', $field->errors) }}
             </div>
             @endif
         </div>
     </div>
 </div>
