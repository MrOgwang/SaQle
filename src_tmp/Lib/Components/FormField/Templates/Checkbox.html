 <div class="form-group">
     <label>{{ $field->label }}
         @if($field->required)
         <span class="required">*</span>
         @endif
     </label>
     <div class='form-group-controls'>
         @if($field->helper_text)
         <div class="help-text">
             {{ $field->helper_text }}
         </div>
         @endif
         <div>
             <div class="choice-group">

					 @else
					 <input type='checkbox' name='{{ $field->name }}[]' id='{{ $field->id }}_{{ $key }}' value='{{ $key }}'/>
					 @endif
					 <label for="{{ $field->id }}_{{ $key }}">{{ $value }}</label>

			 </div>

             <div class="field-error">
                 {{ implode(',', $field->errors) }}

     </div>
 </div>
