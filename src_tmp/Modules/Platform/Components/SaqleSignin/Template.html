<div class="signin-card">
     <div class="logo">
         <h1>Welcome Back</h1>
         <p>Sign in to continue</p>
     </div>
     <form method='POST' id="signinForm">
         @csrf
         @let($message = notification())
         @if($message)
         <div style='margin-bottom: 10px;'>
             <ui:component name='saqle.lib.message' :type='$message->type' :message='$message->message'/>
         </div>
         @endif
         <ui:component 
             name="saqle.lib.formfield" 
             bind='app.auth.user:username' 
             required='0' 
             label="User Name"
         />
         <ui:component 
             name="saqle.lib.formfield" 
             bind='app.auth.user:password' 
             required='0' 
             label="Password"
         />
         <div class='form-buttons'>
             <button class="submit-button" type="submit" id="submitButton">
                 <span class="button-label">Sign in</span>
                 <span class="button-spinner" aria-hidden="true"></span>
             </button>
             <div class='flex center' style='margin-top: 20px;'>
                 <a href='/' class='flex center'>Return to main site</a>
             </div>
         </div>
     </form>
</div>
